name: Build DigitBoard APK CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace || echo "Release build step finished"

      - name: Organize APK Artifacts
        run: |
          mkdir -p apk_outputs
          cp -v app/build/outputs/apk/debug/*.apk apk_outputs/DigitBoard-v1.0.0-debug.apk || true
          cp -v app/build/outputs/apk/release/*.apk apk_outputs/DigitBoard-v1.0.0-release.apk || true
          ls -la apk_outputs/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DigitBoard-APKs
          path: apk_outputs/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          git tag -f "$TAG_NAME" || true
          git push origin "$TAG_NAME" -f || true
          gh release create "$TAG_NAME" apk_outputs/*.apk \
            --title "DigitBoard Virtual Keyboard $TAG_NAME" \
            --notes "Compilação automática de APK realizada com sucesso via GitHub Actions CI/CD." || echo "Release step finished"
