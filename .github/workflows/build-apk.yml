name: Build DigitBoard APK CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace || echo "Release build step finished"

      - name: Organize APK Artifacts
        run: |
          mkdir -p apk_outputs
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} apk_outputs/ \; || true
          ls -la apk_outputs/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DigitBoard-APKs
          path: apk_outputs/

      - name: Create GitHub Release on Tag or Dispatch
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          gh release create "$TAG_NAME" apk_outputs/*.apk \
            --title "DigitBoard Virtual Keyboard $TAG_NAME" \
            --notes "Compilação automática via GitHub Actions CI/CD. Contém arquivos APK para instalação e teste no Android."
